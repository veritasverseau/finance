<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jajan Tracker</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f4;--card:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#0f766e;--bad:#c2410c;--ok:#15803d;--bd:#e5e1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--card:#1b201d;--tx:#eceee9;--mu:#9aa39c;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a312d}}
:root[data-theme="dark"]{--bg:#121513;--card:#1b201d;--tx:#eceee9;--mu:#9aa39c;--ac:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--bd:#2a312d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.bar.over i{background:var(--bad)}
.r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}.r:last-child{border:0}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--mu);padding:2px 8px;font-weight:400}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.f label{font-size:12px;color:var(--mu)}
.q{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.q button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;font-weight:400}
.mo{font-weight:600;margin:10px 0 4px}
</style></head><body><h1>💸 Jajan Tracker</h1><div id="app"></div><script>
const K='jt3';
const DEF={s:{wk:270000},e:[],d:[
{n:'Loan app (16 loans, Nov-Jan)',a:8885016},
{n:'Tokopedia Card Oct bill (pay in full, due 1 Nov)',a:1552852},
{n:'BRI Kredit remainder (close card)',a:1980000},
{n:'Motor ke Amiyu',a:2600000},
{n:'Cicilan gym (2 left)',a:1900000},
{n:'Cicilan tablet (3 left)',a:2850000},
{n:'Nai nai (sepatu)',a:500000},
{n:'Angpao oma',a:200000},
{n:'Celana',a:200000},
{n:'Sunscreen',a:85000},
{n:'Family loan 0% (repay Dec)',a:965000}]};
const FC=[
{m:'November',inc:[['Salary 6.7jt + commission 1.1jt',7800000],['Family loan 0% in',965000]],out:[['Loan app',4076736],['Tokopedia Oct bill (pay in full)',1552852],['Gym (1 of 2 left)',950000],['Tablet (1 of 3 left)',950000],['Living, tight',1150000],['Sunscreen',85000]]},
{m:'December',inc:[['Salary + THR',13400000]],out:[['Repay family loan',965000],['Loan app',3137075],['Card bill (Nov spending, cap)',847148],['Gym (last)',950000],['Tablet',950000],['Living, tight',1150000],['Motor Amiyu',2600000],['BRI Kredit (close card)',1980000],['Nai nai (sepatu)',500000],['Angpao oma',200000]]},
{m:'January',inc:[['Salary',6700000]],out:[['Loan app (last)',1671205],['Tablet (last)',950000],['Card bill (Dec spending, est.)',847148],['Living, tight',1150000],['Celana',200000]]}
];
let S=JSON.parse(JSON.stringify(DEF));
try{const r=JSON.parse(localStorage.getItem(K)||'null');if(r){S.s=Object.assign(S.s,r.s);S.e=r.e||[];if(r.d)S.d=r.d}}catch(x){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const R=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('en-US');
const p=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const sum=(a,b)=>S.e.filter(x=>x.d>=a&&x.d<=b).reduce((t,x)=>t+x.a,0);
const tot=l=>l.reduce((t,x)=>t+x[1],0);
function render(){
const s=S.s,n=new Date(),td=ds(n),k=(n.getDay()+6)%7;
const ws=new Date(n);ws.setDate(n.getDate()-k);const we=new Date(ws);we.setDate(ws.getDate()+6);
const wsd=ds(ws),wed=ds(we),daily=s.wk/7;
const today=sum(td,td),wk=sum(wsd,wed),left=s.wk-wk,dl=7-k;
const pct=(a,b)=>Math.min(100,Math.max(0,a/b*100));
const td2=S.d.reduce((t,x)=>t+x.a,0);
const inp=(k,l)=>`<div><label>${l}</label><input inputmode="numeric" value="${s[k].toLocaleString('en-US')}" onchange="up('${k}',this.value)"></div>`;
const fc=FC.map(m=>{const i=tot(m.inc),o=tot(m.out),b=i-o;return `<div class="c"><h2>${m.m} · in ${R(i)}</h2>${m.inc.map(x=>`<div class="r"><span>${x[0]}</span><b>${R(x[1])}</b></div>`).join('')}<div class="mo mu">Out</div>${m.out.map(x=>`<div class="r"><span>${x[0]}</span><span>${R(x[1])}</span></div>`).join('')}<div class="r" style="margin-top:6px"><b>${b<0?'Short by':'Left over'}</b><b class="${b<0?'bad':'ok'}">${R(Math.abs(b))}</b></div></div>`}).join('');
document.getElementById('app').innerHTML=`
<div class="c"><h2>Today</h2><div class="big ${today>daily?'bad':'ok'}">${R(today)}</div>
<div class="mu">of ${R(daily)} daily target · ${today>daily?R(today-daily)+' over':R(daily-today)+' left'}</div>
<div class="bar ${today>daily?'over':''}"><i style="width:${pct(today,daily)}%"></i></div>
<div class="f" style="margin-top:10px"><div><label>Amount (Rp)</label><input id="a" inputmode="numeric" placeholder="15000"></div><div><label>What</label><input id="n" placeholder="kopi, makan siang"></div></div>
<div class="q">${[5000,10000,15000,20000].map(v=>`<button onclick="document.getElementById('a').value=${v}">${v/1000}k</button>`).join('')}</div>
<button onclick="add()" style="width:100%">Add spending</button></div>
<div class="c"><h2>This week's envelope</h2><div class="r"><span>Budget (tight)</span><b>${R(s.wk)}</b></div><div class="r"><span>Spent</span><b>${R(wk)}</b></div>
<div class="bar ${left<0?'over':''}"><i style="width:${pct(wk,s.wk)}%"></i></div>
<div class="${left<0?'bad':'ok'}"><b>${left<0?'Over by '+R(-left):R(left)+' left'}</b></div>
<div class="mu">${left>0?`${dl} day${dl>1?'s':''} left, about ${R(left/dl)}/day. Keep daily food near 20k, coffee 2x/week, and cigarettes/darts at 2 boxes a week.`:'Envelope empty. Rest of the week: bring food from home, no coffee or bar.'}</div></div>
<div class="c"><h2>Debts still owed · total ${R(td2)}</h2>${S.d.map((x,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div style="font-size:14px;margin-bottom:6px;overflow-wrap:anywhere">${x.n}</div><div style="display:flex;gap:6px"><input style="padding:6px 8px" inputmode="numeric" value="${x.a.toLocaleString('en-US')}" onchange="ud(${i},this.value)"><button class="g" style="font-size:18px" onclick="dd(${i})">✓</button></div></div>`).join('')}
<div class="f" style="margin-top:8px"><input id="dn" placeholder="New debt"><input id="da" inputmode="numeric" placeholder="Amount"></div><button onclick="ad()" style="width:100%">Add debt</button>
<div class="mu" style="margin-top:6px">Tick ✓ when a debt is fully paid. Don't take any new loans.</div></div>
<div class="c"><h2>Plan (edit)</h2><div class="f">${inp('wk','Jajan budget / week')}</div>
<div class="mu">Salary 6.7jt/month. Nov has +1.1jt commission and the 965k family loan. Dec has THR 6.7jt.</div></div>
<div class="c"><h2>Forecast Nov–Jan</h2>${fc}
<div class="mu"><b>Rules:</b><br>1. No new loans. Nov is the last one.<br>2. Pay the loan app on time every month.<br>3. Pay the Tokopedia Oct bill (1.55jt) in full on 1 Nov.<br>4. Repay the family loan 965k in Dec. Don't let it slip into Jan.<br>5. Card: spend only up to the Dec cap (847k). Stop using it once you hit it.<br>6. Appraisal bonus = buffer or prepay Jan, not spending money.</div></div>
<div class="c"><h2>Recent</h2>${S.e.length?S.e.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,12).map(x=>`<div class="r"><span>${x.d.slice(5)} · ${x.n||'jajan'}</span><span>${R(x.a)} <button class="g" onclick="del(${x.id})">✕</button></span></div>`).join(''):'<div class="mu">Nothing logged yet.</div>'}</div>`;}
function add(){const a=+document.getElementById('a').value.replace(/\D/g,'');if(!a)return;S.e.push({id:Date.now(),d:ds(new Date()),a,n:document.getElementById('n').value.trim()});sv();render()}
function del(i){S.e=S.e.filter(x=>x.id!==i);sv();render()}
function up(k,v){S.s[k]=+String(v).replace(/\D/g,'')||0;sv();render()}
function ud(i,v){S.d[i].a=+String(v).replace(/\D/g,'')||0;sv();render()}
function dd(i){S.d.splice(i,1);sv();render()}
function ad(){const n=document.getElementById('dn').value.trim(),a=+document.getElementById('da').value.replace(/\D/g,'');if(!n||!a)return;S.d.push({n,a});sv();render()}
render();</script></body></html>
